# Builds a SIGNED release bundle for Google Play, triggered by pushing a version tag:
#
#     git tag v3.0 && git push origin v3.0
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64      your .jks keystore, base64-encoded
#   KEYSTORE_PASSWORD    the keystore password
#   KEY_ALIAS            the key alias inside the keystore
#   KEY_PASSWORD         that key's password
#
# To encode the keystore:
#   PowerShell:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("upload.jks")) | Set-Clipboard
#   macOS/Linux: base64 -w0 upload.jks | pbcopy
#
# The keystore itself must never be committed — only ever as a secret.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the platform this app compiles against
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set — add the four signing secrets first." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed App Bundle
        env:
          MOVEMENTID_KEYSTORE: ${{ runner.temp }}/upload.jks
          MOVEMENTID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MOVEMENTID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MOVEMENTID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew bundleRelease --stacktrace
          else
            gradle bundleRelease --stacktrace
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: movementid-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Convenience for sideloading: the same build as an installable APK.
      - name: Attach to a GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
