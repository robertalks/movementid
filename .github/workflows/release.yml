# Builds a SIGNED release, triggered by pushing a version tag:
#
#     git tag v3.0 && git push origin v3.0
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64      your .jks keystore, base64-encoded
#   KEYSTORE_PASSWORD    the keystore password
#   KEY_ALIAS            the key alias inside the keystore
#   KEY_PASSWORD         that key's password
#
# To encode the keystore:
#   PowerShell:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("upload.jks")) | Set-Clipboard
#   macOS/Linux: base64 -w0 upload.jks | pbcopy
#
# The keystore itself must never be committed — only ever as a secret.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only in repositories whose default workflow permissions are
# set to read. Creating a Release needs write access to repository contents; nothing else here
# does, so this is the narrowest grant that works.
permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # `packages` must be set explicitly: the action's default includes the legacy "tools"
      # package, which Google has removed from the SDK repository, so the default fails.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set — add the four signing secrets first." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed APK
        env:
          MOVEMENTID_KEYSTORE: ${{ runner.temp }}/upload.jks
          MOVEMENTID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MOVEMENTID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MOVEMENTID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            # .apk for sideloading and GitHub Releases.
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      # Gradle still produces an APK when signing isn't configured — it just names it
      # "app-release-unsigned.apk". Publishing that looks fine until someone tries to install
      # it and Android says the package is invalid, so fail here instead.
      - name: Verify the APK is signed
        run: |
          ls -la app/build/outputs/apk/release/
          if ls app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::The APK is UNSIGNED — the signing config didn't apply. Check the four signing secrets." >&2
            exit 1
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      # Renamed so downloads say what version they are, rather than "app-release.apk".
      - name: Name the files after the tag
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk   "dist/MovementID-$VERSION.apk"
          ls -la dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: movementid-release
          path: dist/*
          if-no-files-found: error

      # The APK is what people sideload; the AAB is only useful for uploading to Play.
      - name: Attach to a GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.apk
          generate_release_notes: true
