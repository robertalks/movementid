# Compiles the app on every push, on a clean machine.
#
# This is a correctness check, not a way to produce something installable — a debug APK is
# signed with a throwaway key and can't be installed over the Play build anyway, so building
# one and uploading it would just be an artifact nobody downloads.
#
# What it does catch is the "works on my machine" class of problem: a file that was never
# committed, an import that only resolves thanks to a local cache, a stray brace. Those are
# exactly the errors that are cheapest to find automatically and most annoying to find by hand.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # `packages` must be set explicitly: the action's default includes the legacy "tools"
      # package, which Google has removed from the SDK repository, so the default fails.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            # Kotlin compilation plus Room's code generation (KSP), which is where a bad DAO
            # query or a changed entity shows up.
            ./gradlew compileDebugKotlin --stacktrace
          else
            echo "::warning::No Gradle wrapper committed — using the runner's Gradle, which may not match your AGP version. Commit gradlew and gradle/wrapper/ to pin it."
            gradle compileDebugKotlin --stacktrace
          fi

      - name: Android Lint
        # Runs even if you only want the compile result, and reports separately so a lint
        # warning doesn't look like a build failure.
        continue-on-error: true
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew lintDebug --stacktrace
          else
            gradle lintDebug --stacktrace
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
