# Gradle's own JVM. 2g was tight for Compose + KSP and is a common cause of the Kotlin daemon
# dying or failing to connect during startup.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a SEPARATE JVM from the one above and gets its own heap. Without
# this it inherits a default that's often too small, which shows up as:
#   "The daemon has terminated unexpectedly on startup attempt #1 with error code: 0"
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Last resort if the daemon still refuses to start (antivirus and locked-down corporate Windows
# images can block the local socket it needs): uncomment to compile inside the Gradle process.
# Slower and uses more of Gradle's heap, but it removes the separate daemon entirely.
# kotlin.compiler.execution.strategy=in-process

# The pinned Android Gradle Plugin predates API 36 and would otherwise warn that it's untested
# against it. Building against 36 works; this just silences the warning. If Android Studio offers
# to upgrade the plugin, accepting is fine and makes this line unnecessary.
android.suppressUnsupportedCompileSdk=36
